<template>
    <div class="dashboard-container slds-p-around_small slds-p-medium_medium">
        
        <!-- ============================================================ -->
        <!-- 1. HERO OPERATIONS COMMAND HEADER                             -->
        <!-- ============================================================ -->
        <div class="command-header slds-p-around_medium slds-m-bottom_medium">
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-grid_align-spread">
                
                <!-- Left: Title, Live Status & Logged-in User Info -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-grid slds-grid_vertical-align-center slds-m-bottom_small slds-large-m-bottom_none">
                    <div class="user-avatar-pill slds-p-around_small slds-m-right_medium slds-text-align_center slds-shrink-none">
                        <div class="slds-text-heading_medium" style="font-weight: 900; line-height: 1; letter-spacing: 0.05em;">
                            {userInitials}
                        </div>
                    </div>
                    <div>
                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                            <span class="live-pulse-dot slds-m-right_x-small"></span>
                            <span class="slds-text-title_caps" style="font-size: 0.7rem; font-weight: 800; color: #a7f3d0; letter-spacing: 0.1em;">
                                Live Dining Operations Active
                            </span>
                        </div>
                        <h1 class="slds-text-heading_medium" style="font-weight: 800; color: #ffffff;">
                            Digital Mess Management Command Center
                        </h1>
                        <p class="slds-text-body_small slds-m-top_xx-small" style="color: #cbd5e1;">
                            Welcome back, <strong style="color: #ffffff;">{userName}</strong> &nbsp;|&nbsp; 
                            <span class="slds-badge slds-badge_inverse" style="background: rgba(255,255,255,0.2);">{userProfile}</span> &nbsp;|&nbsp; 
                            <span style="color: #94a3b8;">Email:</span> {userEmail}
                        </p>
                    </div>
                </div>

                <!-- Right: Quick Navigation Actions -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12 slds-text-align_left slds-large-text-align_right">
                    <lightning-button 
                        label="Refresh Data" 
                        icon-name="utility:refresh" 
                        variant="neutral" 
                        onclick={handleRefresh}
                        disabled={isRefreshing}
                        class="slds-m-right_x-small slds-m-bottom_xx-small">
                    </lightning-button>
                    <lightning-button 
                        label="Login Users &amp; Issuers" 
                        icon-name="standard:user" 
                        variant="brand-outline" 
                        onclick={navigateToMessUsers}
                        class="slds-m-right_x-small slds-m-bottom_xx-small">
                    </lightning-button>
                    <lightning-button 
                        label="Students Roster" 
                        icon-name="standard:contact" 
                        variant="brand" 
                        onclick={navigateToStudents}
                        class="slds-m-bottom_xx-small">
                    </lightning-button>
                </div>

            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 2. EXECUTIVE KPI CARDS ROW                                   -->
        <!-- ============================================================ -->
        <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
            
            <!-- KPI 1: Tokens Issued Today -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card kpi-card-tokens slds-p-around_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <span class="slds-text-title_caps slds-text-color_weak" style="font-weight: 700;">Tokens Issued Today</span>
                        <lightning-icon icon-name="custom:custom44" size="small"></lightning-icon>
                    </div>
                    <div class="slds-text-heading_large slds-m-top_x-small" style="font-weight: 900; color: #002b5c;">
                        {totalTokensToday}
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters_xx-small slds-m-top_small slds-text-body_small" style="font-size: 0.75rem;">
                        <span class="slds-col slds-text-color_weak">🍳 B: <strong>{breakfastCount}</strong></span>
                        <span class="slds-col slds-text-color_weak">🍛 L: <strong>{lunchCount}</strong></span>
                        <span class="slds-col slds-text-color_weak">☕ S: <strong>{snacksCount}</strong></span>
                        <span class="slds-col slds-text-color_weak">🍲 D: <strong>{dinnerCount}</strong></span>
                    </div>
                </div>
            </div>

            <!-- KPI 2: Diet Preference Breakdown -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card kpi-card-diet slds-p-around_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <span class="slds-text-title_caps slds-text-color_weak" style="font-weight: 700;">Meal Dietary Split</span>
                        <lightning-icon icon-name="custom:custom5" size="small"></lightning-icon>
                    </div>
                    <div class="slds-grid slds-grid_vertical-align-baseline slds-m-top_x-small">
                        <span class="slds-text-heading_large" style="font-weight: 900; color: #065f46;">{vegCount}</span>
                        <span class="slds-m-horizontal_x-small slds-text-color_weak">Veg vs</span>
                        <span class="slds-text-heading_medium" style="font-weight: 800; color: #9a3412;">{nonVegCount}</span>
                        <span class="slds-m-left_xx-small slds-text-color_weak">Non-Veg</span>
                    </div>
                    <!-- Dual progress bar -->
                    <div class="diet-bar-track slds-m-top_small">
                        <div class="diet-bar-veg" style={vegStyleWidth}></div>
                    </div>
                    <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small slds-text-body_small" style="font-size: 0.7rem; color: #64748b;">
                        <span>{vegPercentage}% Veg</span>
                        <span>{nonVegCount} Non-Veg</span>
                    </div>
                </div>
            </div>

            <!-- KPI 3: Registered Students -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card kpi-card-students slds-p-around_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <span class="slds-text-title_caps slds-text-color_weak" style="font-weight: 700;">Enrolled Students</span>
                        <lightning-icon icon-name="standard:avatar" size="small"></lightning-icon>
                    </div>
                    <div class="slds-text-heading_large slds-m-top_x-small" style="font-weight: 900; color: #1a365d;">
                        {totalStudents}
                    </div>
                    <div class="slds-grid slds-grid_align-spread slds-m-top_small slds-text-body_small">
                        <span class="slds-text-color_weak">Dining Attendance Rate:</span>
                        <span class="slds-badge slds-theme_success" style="font-weight: 800;">{attendanceRate}%</span>
                    </div>
                </div>
            </div>

            <!-- KPI 4: Active Login Users / Token Issuers -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card kpi-card-users slds-p-around_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <span class="slds-text-title_caps slds-text-color_weak" style="font-weight: 700;">Login Accounts &amp; Issuers</span>
                        <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                    </div>
                    <div class="slds-text-heading_large slds-m-top_x-small" style="font-weight: 900; color: #c46a24;">
                        {totalMessUsers}
                    </div>
                    <div class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                        Managers &amp; Principals with Token Rights
                    </div>
                </div>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- 3. INTERACTIVE TABBED AUDIT & GOVERNANCE VIEW               -->
        <!-- ============================================================ -->
        <div class="command-card slds-p-around_medium">
            <lightning-tabset variant="scoped">
                
                <!-- -------------------------------------------------------- -->
                <!-- TAB 1: LIVE TOKEN ISSUANCE AUDIT LOG                     -->
                <!-- -------------------------------------------------------- -->
                <lightning-tab label="Live Meal Tokens Audit" icon-name="custom:custom44">
                    <div class="slds-p-top_small">
                        
                        <!-- Search & Filter Controls -->
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_medium slds-grid_align-spread">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small slds-medium-m-bottom_none">
                                <lightning-input 
                                    type="search" 
                                    label="Search Tokens" 
                                    variant="label-hidden" 
                                    placeholder="Filter by token #, student name, roll number, or issuer..." 
                                    onchange={handleTokenSearch}
                                    class="search-input-field">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-text-align_right">
                                <lightning-combobox 
                                    name="mealFilter" 
                                    label="Meal Session Filter" 
                                    variant="label-hidden" 
                                    value={selectedMealFilter} 
                                    options={mealFilterOptions} 
                                    onchange={handleMealFilterChange}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <!-- Tokens Table -->
                        <template if:true={hasTokens}>
                            <div class="slds-scrollable_x slds-border_top slds-border_bottom">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset" style="background: #f8fafc;">
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Token #</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Student Name</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Roll Number</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Department &amp; Room</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Meal Session</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Diet</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Time</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Issued By (Login Account)</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Status</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={filteredTokens} for:item="token">
                                            <tr key={token.Id}>
                                                <td>
                                                    <span class="badge-token-num">{token.Token_Number__c}</span>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate" style="font-weight: 700; color: #002b5c;">
                                                        {token.StudentName}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak font-mono" style="font-weight: 600;">
                                                        {token.StudentRoll}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak">
                                                        {token.StudentDept}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate" style="font-weight: 600;">
                                                        {token.Meal_Type__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class={token.dietBadgeClass}>{token.Diet_Preference__c}</span>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate font-mono" style="font-size: 0.8rem;">
                                                        {token.Token_Time__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <template if:true={token.issuerUrl}>
                                                        <a href={token.issuerUrl} target="_blank" style="font-weight: 700; color: #002b5c;">
                                                            {token.issuerName}
                                                        </a>
                                                        <div class="slds-text-body_small slds-text-color_weak" style="font-size: 0.7rem;">
                                                            {token.issuerEmail}
                                                        </div>
                                                    </template>
                                                    <template if:false={token.issuerUrl}>
                                                        <span style="font-weight: 600;">{token.issuerName}</span>
                                                    </template>
                                                </td>
                                                <td>
                                                    <span class="slds-badge slds-theme_success">{token.Status__c}</span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:false={hasTokens}>
                            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                <lightning-icon icon-name="utility:info" size="medium" class="slds-m-bottom_small"></lightning-icon>
                                <p class="slds-text-heading_small">No tokens found matching this filter.</p>
                                <p class="slds-text-body_small slds-m-top_xx-small">Tokens issued from the frontend application will display here in real time.</p>
                            </div>
                        </template>

                    </div>
                </lightning-tab>

                <!-- -------------------------------------------------------- -->
                <!-- TAB 2: SEPARATE OBJECT: LOGIN USERS & TOKEN ISSUERS       -->
                <!-- -------------------------------------------------------- -->
                <lightning-tab label="Login Users &amp; Token Issuers" icon-name="standard:user">
                    <div class="slds-p-top_small">
                        
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_medium slds-grid_align-spread">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                                <lightning-input 
                                    type="search" 
                                    label="Search Users" 
                                    variant="label-hidden" 
                                    placeholder="Search by manager name, email, or role..." 
                                    onchange={handleUserSearch}
                                    class="search-input-field">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-text-align_right slds-m-top_x-small slds-medium-m-top_none">
                                <lightning-button 
                                    label="Open Mess Users Table" 
                                    icon-name="utility:new_window" 
                                    onclick={navigateToMessUsers}>
                                </lightning-button>
                            </div>
                        </div>

                        <!-- Mess Users Table -->
                        <template if:true={hasMessUsers}>
                            <div class="slds-scrollable_x slds-border_top slds-border_bottom">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset" style="background: #f8fafc;">
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">User Full Name</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Institutional Email</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Contact Phone</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Designated Role</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Department</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Tokens Issued Today</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Lifetime Issued</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Last Login</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Status</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={filteredMessUsers} for:item="user">
                                            <tr key={user.Id}>
                                                <td>
                                                    <a href={user.recordUrl} target="_blank" style="font-weight: 700; color: #002b5c;">
                                                        {user.Name}
                                                    </a>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak font-mono">
                                                        {user.Email__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak font-mono">
                                                        {user.cleanPhone}
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class={user.roleBadgeClass}>{user.Role__c}</span>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak">
                                                        {user.Department__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class="slds-badge slds-theme_success" style="font-weight: 800; font-size: 0.8rem;">
                                                        {user.tokensToday} Tokens
                                                    </span>
                                                </td>
                                                <td>
                                                    <span class="slds-badge slds-badge_inverse" style="font-weight: 800;">
                                                        {user.totalTokens}
                                                    </span>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate font-mono" style="font-size: 0.75rem;">
                                                        {user.formattedLastLogin}
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class={user.statusBadgeClass}>{user.Status__c}</span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:false={hasMessUsers}>
                            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                <lightning-icon icon-name="utility:info" size="medium" class="slds-m-bottom_small"></lightning-icon>
                                <p class="slds-text-heading_small">No Mess Managers or Token Issuers registered yet.</p>
                                <p class="slds-text-body_small slds-m-top_xx-small">When a Mess Manager or Principal logs in, their profile will be created automatically.</p>
                            </div>
                        </template>

                    </div>
                </lightning-tab>

                <!-- -------------------------------------------------------- -->
                <!-- TAB 3: REGISTERED STUDENTS DINING ROSTER                  -->
                <!-- -------------------------------------------------------- -->
                <lightning-tab label="Registered Students Dining Roster" icon-name="standard:contact">
                    <div class="slds-p-top_small">
                        
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_medium slds-grid_align-spread">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                                <lightning-input 
                                    type="search" 
                                    label="Search Students" 
                                    variant="label-hidden" 
                                    placeholder="Search by student name, roll number, or department..." 
                                    onchange={handleStudentSearch}
                                    class="search-input-field">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-text-align_right slds-m-top_x-small slds-medium-m-top_none">
                                <lightning-button 
                                    label="Open All Students Table" 
                                    icon-name="utility:new_window" 
                                    onclick={navigateToStudents}>
                                </lightning-button>
                            </div>
                        </div>

                        <!-- Students Table -->
                        <template if:true={hasStudents}>
                            <div class="slds-scrollable_x slds-border_top slds-border_bottom">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset" style="background: #f8fafc;">
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Student Name</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Roll Number</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Academic Year</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Department</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Hostel &amp; Room</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Diet Preference</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Contact Phone</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Student Email</div></th>
                                            <th scope="col"><div class="slds-truncate" style="font-weight: 800;">Status</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={filteredStudents} for:item="student">
                                            <tr key={student.Id}>
                                                <td>
                                                    <a href={student.recordUrl} target="_blank" style="font-weight: 700; color: #002b5c;">
                                                        {student.Name}
                                                    </a>
                                                </td>
                                                <td>
                                                    <span class="slds-badge font-mono" style="font-weight: 700;">
                                                        {student.Student_ID__c}
                                                    </span>
                                                </td>
                                                <td>
                                                    <span class="slds-badge font-mono" style="font-weight: 700; background: #e0f2fe; color: #0369a1;">
                                                        {student.academicYear}
                                                    </span>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak">
                                                        {student.Department__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak font-mono">
                                                        {student.Hostel_Room__c}
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class={student.dietBadgeClass}>{student.Diet_Preference__c}</span>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak font-mono">
                                                        {student.cleanPhone}
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="slds-truncate slds-text-color_weak font-mono" style="font-size: 0.75rem;">
                                                        {student.cleanEmail}
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class={student.statusBadgeClass}>{student.Status__c}</span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:false={hasStudents}>
                            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                                <lightning-icon icon-name="utility:info" size="medium" class="slds-m-bottom_small"></lightning-icon>
                                <p class="slds-text-heading_small">No students found matching this search.</p>
                            </div>
                        </template>

                    </div>
                </lightning-tab>

            </lightning-tabset>
        </div>

    </div>
</template>
